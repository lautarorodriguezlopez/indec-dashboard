name: Preview rediseño (rama rediseno)

on:
  push:
    branches: [rediseno]

permissions:
  contents: read

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: gh release download datos -D data/parquet --clobber
      - run: python ingesta/sitio.py
      - name: Verificar
        run: |
          grep -o 'name="build" content="[0-9]*"' site/index.html
          grep -c '__BUILD__' site/index.html || true
          python -c "import json;t=json.load(open('site/data/tableros.json'));print([d['clave'] for d in t['destacados']])"
