name: Preview rediseño (rama rediseno)

on:
  push:
    branches: [rediseno]

permissions:
  contents: read

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: gh release download datos -D data/parquet --clobber
      - run: python ingesta/sitio.py
      - name: Volcar datos del sitio
        run: |
          tar czf d.tgz site/data
          echo "<<<RAST"; base64 -w 20000 d.tgz; echo "RAST>>>"
