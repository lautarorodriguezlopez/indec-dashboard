name: Fase 2 (preview, rama fase2)

on:
  push:
    branches: [fase2]

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Leer planillas del INDEC (prueba real)
        run: python ingesta/planillas.py && python -c "import json;d=json.load(open('data/parquet/estado_planillas.json'));print(d['series_ok'],'/',d['series_total'])"
