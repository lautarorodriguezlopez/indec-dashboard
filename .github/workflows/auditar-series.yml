name: Auditar series de datos.gob.ar

# Manual y de solo lectura: lista candidatas y la fecha de su último dato.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditar
        run: |
          python ingesta/auditar_series.py > auditoria.json
          echo "<<<AUDIT"
          gzip -c auditoria.json | base64 -w 20000
          echo "AUDIT>>>"
