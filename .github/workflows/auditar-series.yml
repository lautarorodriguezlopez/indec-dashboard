name: Auditar series de datos.gob.ar

# Manual y de solo lectura: lista candidatas y la fecha de su último dato.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnóstico de acceso
        run: |
          curl -s -o /dev/null -w "curl por defecto: %{http_code}\n" "https://apis.datos.gob.ar/series/api/search/?q=supermercados&limit=1" || true
          curl -s -o /dev/null -w "curl con User-Agent: %{http_code}\n" -A "indec-dashboard/1.0 (+https://github.com/lautarorodriguezlopez/indec-dashboard)" "https://apis.datos.gob.ar/series/api/search/?q=supermercados&limit=1" || true
          curl -s -o /dev/null -w "series directa: %{http_code}\n" -A "indec-dashboard/1.0" "https://apis.datos.gob.ar/series/api/series/?ids=101.1_I2NG_2016_M_22&last=1" || true
      - name: Auditar
        run: |
          python ingesta/auditar_series.py > auditoria.json
          echo "<<<AUDIT"
          gzip -c auditoria.json | base64 -w 20000
          echo "AUDIT>>>"
      - name: Validar IDs
        run: |
          echo "<<<VALID"
          python ingesta/validar_series.py 455.1_VENTAS_PREADA_0_M_44_44 455.1_VENTAS_PRENAL_0_M_34_10 455.1_VENTAS_PRETES_0_M_25_98 455.1_CANALES_ONINE_0_M_15_84 455.1_SALON_VENTTAS_0_M_12_82 455.1_EFECTIVOIVO_0_M_8_15 455.1_TARJETAS_DITO_0_M_15_92 455.1_TARJETAS_CITO_0_M_16_85 455.1_OTROS_MEDIIOS_0_M_12_32 456.1_VENTAS_PREADA_0_M_44_40 458.1_VENTAS_TOTADA_0_M_52_56 33.2_ISAC_SIN_EDAD_0_M_23_56 33.2_ISAC_NIVELRAL_0_M_18_63 33.3_ISAC_CEMENAND_0_0_21_29 33.4_ISAC_CEMENAND_0_0_21_24 33.3_ISAC_HIERRION_0_0_49_36 33.3_ISAC_LADRICOS_0_0_21_27 33.3_ISAC_PINTUION_0_0_31_13 33.3_ISAC_ASFALLTO_0_0_12_97 33.3_ISAC_HORMIADO_0_0_23_36 322.3_TURISMO_REIVO__17 322.3_TURISMO_EMIVO__15 4.2_OGP_2004_T_17 65.1_CGI_0_0_21 31.3_UNG_2004_M_18 31.3_UPT_2004_M_23 31.3_USPQ_2004_M_34 31.3_UIMB_2004_M_33 31.3_UV_2004_M_25 302.3_S_TENDENCIRAL_0_S_28 302.3_S_ORIGINALRAL_0_S_28 | gzip -c | base64 -w 20000
          echo "VALID>>>"
