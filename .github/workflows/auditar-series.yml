name: Auditar series de datos.gob.ar

# Manual y de solo lectura: lista candidatas y la fecha de su último dato.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnóstico de acceso
        run: |
          curl -s -o /dev/null -w "curl por defecto: %{http_code}\n" "https://apis.datos.gob.ar/series/api/search/?q=supermercados&limit=1" || true
          curl -s -o /dev/null -w "curl con User-Agent: %{http_code}\n" -A "indec-dashboard/1.0 (+https://github.com/lautarorodriguezlopez/indec-dashboard)" "https://apis.datos.gob.ar/series/api/search/?q=supermercados&limit=1" || true
          curl -s -o /dev/null -w "series directa: %{http_code}\n" -A "indec-dashboard/1.0" "https://apis.datos.gob.ar/series/api/series/?ids=101.1_I2NG_2016_M_22&last=1" || true
      - name: Auditar
        run: |
          python ingesta/auditar_series.py > auditoria.json
          echo "<<<AUDIT"
          gzip -c auditoria.json | base64 -w 20000
          echo "AUDIT>>>"
