name: Descubrir fuentes (fase 3)

# Solo lectura y solo en la rama fase3: lista lo disponible en BCRA,
# datos.gob.ar y la Secretaría de Energía. Se borra al cerrar la fase.
on:
  push:
    branches: [fase3]
    paths: [ingesta/descubrir_fase3.py, .github/workflows/descubrir-fase3.yml]

permissions:
  contents: read

jobs:
  descubrir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ingesta/descubrir_fase3.py
