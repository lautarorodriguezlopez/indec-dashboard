name: Publicar sitio

# Arma los datos del sitio desde el release "datos" y lo publica en GitHub Pages.
# Se llama al final de la ingesta semanal y también se puede correr a mano.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer los datos
        run: gh release download datos -D data/parquet --clobber

      - name: Armar los datos del sitio
        run: python ingesta/sitio.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Dependencias fijadas en package-lock.json; sin scripts de instalación
      - name: Construir el explorador
        run: |
          npm ci --ignore-scripts
          npm audit --omit=optional --audit-level=high
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
