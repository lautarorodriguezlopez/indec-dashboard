name: Probar ingesta (fase 3)

# Solo en la rama fase3: corre las ingestas nuevas y vuelca los Parquet al log
# para revisarlos. Se borra al cerrar la fase.
on:
  push:
    branches: [fase3]
    paths: [ingesta/bcra.py, ingesta/bcra.json, ingesta/series.json, ingesta/series_tiempo.py, .github/workflows/probar-fase3.yml]

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ingesta/bcra.py
      - run: python ingesta/series_tiempo.py
      - name: Volcar resultados al log (para revisarlos fuera de GitHub)
        run: |
          cd data/parquet
          echo "===INICIO==="
          tar czf - bcra.parquet estado_bcra.json series_extra.parquet estado_series.json | base64 -w 0
          echo
          echo "===FIN==="
