name: Ingesta INDEC

# De lunes a viernes a las 17:13 de Argentina (20:13 UTC). El INDEC publica
# sus informes en días hábiles a las 16:00 y la API se actualiza minutos
# después, así que cada dato nuevo aparece en el sitio el mismo día.
# El minuto no es 00 para esquivar la congestión de GitHub a la hora en punto.
# También se puede correr a mano desde Actions → Run workflow.
on:
  schedule:
    - cron: "13 20 * * 1-5"
  workflow_dispatch:
    inputs:
      completa:
        description: "Bajar todo de nuevo (pasada completa)"
        type: boolean
        default: false

permissions:
  contents: write # para guardar los datos como release "datos"

concurrency:
  group: ingesta
  cancel-in-progress: false

env:
  RELEASE_TAG: datos
  GH_TOKEN: ${{ github.token }}

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer los datos de la semana anterior
        run: |
          mkdir -p data/parquet
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" -D data/parquet --clobber
            echo "Datos previos: $(ls data/parquet | wc -l) archivos"
          else
            echo "No hay datos previos: va una pasada completa."
          fi

      - name: Elegir modo
        id: modo
        run: |
          # Completa si se pidió a mano, si no hay datos previos o si es el primer lunes del mes
          if [ "${{ inputs.completa }}" = "true" ] || [ ! -f data/parquet/estado.json ] \
             || { [ "$(date -u +%d)" -le 7 ] && [ "$(date -u +%u)" -eq 1 ]; }; then
            echo "flag=--completa" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Bajar los 19 servicios
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
        run: python ingesta/ingestar.py ${{ steps.modo.outputs.flag }}

      - name: Guardar los datos en el release "datos"
        if: always() && hashFiles('data/parquet/estado.json') != ''
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Datos INDEC" \
              --notes "Datos del Catálogo API-INDEC en Parquet, actualizados cada día hábil. Fuente: INDEC." \
              --latest=false
          fi
          gh release upload "$RELEASE_TAG" data/parquet/* --clobber
          gh release edit "$RELEASE_TAG" --notes "Datos del Catálogo API-INDEC en Parquet, actualizados cada día hábil a las 17:13 (hora argentina). Fuente: INDEC."

      - name: Avisar si hay algo que atender
        run: python ingesta/alertas.py

  publicar:
    needs: ingesta
    # Publica aunque falle el aviso final (por ejemplo, token por vencer):
    # lo importante es que los datos se hayan guardado.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar.yml
